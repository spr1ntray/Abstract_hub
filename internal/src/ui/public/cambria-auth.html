<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Вход в Cambria · Abstract Hub</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/game-auth.css" />
    <link rel="stylesheet" href="/cambria-auth.css" />
    <script src="/cambria-auth.js" defer></script>
  </head>
  <body>
    <main class="auth-shell">
      <header class="auth-brand">
        <span class="auth-mark auth-mark--cambria" aria-hidden="true"
          ><img src="/assets/cambria-logo.png" alt=""
        /></span>
        <div>
          <strong>Abstract Hub</strong>
          <span>Безопасный вход Cambria через Abstract</span>
        </div>
      </header>

      <section class="auth-panel" aria-labelledby="auth-heading">
        <span class="auth-kicker">CAMBRIA SESSION</span>
        <h1 id="auth-heading">Подключение Cambria</h1>

        <div class="auth-account">
          <span>Аккаунт в приложении</span>
          <strong id="auth-account-name">Загрузка...</strong>
          <code id="auth-account-address">0x...</code>
        </div>

        <div class="auth-state" role="status" aria-live="polite">
          <span id="auth-status-dot" class="auth-state-dot" data-tone="waiting"></span>
          <p id="auth-status" data-tone="waiting">Готовим ссылку...</p>
        </div>

        <div class="auth-actions auth-actions--cambria">
          <button id="cambria-action" class="auth-action" type="button">Подключить Abstract</button>
          <button id="cambria-switch" class="auth-switch" type="button" hidden>
            Сменить аккаунт
          </button>
        </div>
      </section>

      <p class="auth-footnote">
        Подпись не создаёт транзакцию и не требует газа. Вход сохраняется только в локальном
        зашифрованном хранилище.
      </p>
    </main>
  </body>
</html>

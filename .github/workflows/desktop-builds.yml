name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS universal
            command: dist:mac
            artifact: abstract-hub-macos
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            label: Windows x64
            command: dist:win
            artifact: abstract-hub-windows
            artifacts: release/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          CI: true
      - run: pnpm ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
